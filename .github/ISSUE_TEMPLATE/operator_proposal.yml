name: "新算子建议 / Operator proposal"
description: "建议通用、离线、确定性的Core算子 / Propose a general deterministic Core operator"
title: "[Operator] "
labels: ["operator"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "该算子解决什么跨场景问题？ / What cross-domain problem does it solve?"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "建议名称 / Proposed name"
      placeholder: "snake_case_operator"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "输入、输出与语义 / Contract"
      description: "对象类型、输出类型、单位、边界语义和错误条件 / Input types, output type, units, boundaries, errors"
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: "正常与边界案例 / Normal and edge cases"
    validations:
      required: true
  - type: checkboxes
    id: properties
    attributes:
      label: "Core适配性 / Core suitability"
      options:
        - label: "不需要网络、密钥或私有数据 / No network, credentials, or private data"
          required: true
        - label: "相同输入产生相同结果 / Deterministic for identical inputs"
          required: true
        - label: "不只是为了单个演示 / Not only for one demonstration"
          required: true
