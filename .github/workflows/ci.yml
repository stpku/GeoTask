# GeoTask Core CI
# Public CI configuration — no internal servers, no private env vars

name: geotask-core

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest jsonschema
      - run: pytest -q
      - name: Collect Python RC evidence shard
        run: python .release/collect_rc_evidence.py collect --target-version 0.4.0 --record-python-ci --output rc-evidence-${{ matrix.python-version }}.json
      - name: Upload Python RC evidence shard
        uses: actions/upload-artifact@v7
        with:
          name: geotask-rc-evidence-${{ matrix.python-version }}
          path: rc-evidence-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Build provider-neutral model Adapter reference package
        run: python -m build examples/model_adapters/provider_neutral --outdir model-adapter-dist
      - name: Check provider-neutral model Adapter distributions
        run: python -m twine check model-adapter-dist/*
      - name: Verify provider-neutral model Adapter distribution contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("model-adapter-dist/*.whl")[0]
          sdist = glob.glob("model-adapter-dist/*.tar.gz")[0]
          wheel_names = zipfile.ZipFile(wheel).namelist()
          sdist_names = tarfile.open(sdist).getnames()
          assert not any(name.startswith("geotask_core/") for name in wheel_names)
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_names)
          required = (
              "/LICENSE",
              "/README.md",
              "/examples/model_runtime_descriptor.json",
              "/examples/model_runtime_request.json",
              "/examples/mock_model_execution_result.json",
              "/src/geotask_model_adapter_reference/adapter.py",
              "/src/geotask_model_adapter_reference/contracts.py",
              "/src/geotask_model_adapter_reference/mock_provider.py",
          )
          assert all(any(name.endswith(item) for name in sdist_names) for item in required)
          PY
      - name: Build OpenAI Responses model Adapter package
        run: python -m build examples/model_adapters/openai_responses --outdir openai-adapter-dist
      - name: Check OpenAI Responses model Adapter distributions
        run: python -m twine check openai-adapter-dist/*
      - name: Verify OpenAI Responses model Adapter distribution contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("openai-adapter-dist/*.whl")[0]
          sdist = glob.glob("openai-adapter-dist/*.tar.gz")[0]
          wheel_names = zipfile.ZipFile(wheel).namelist()
          sdist_names = tarfile.open(sdist).getnames()
          assert not any(
              name.startswith("geotask_core/")
              or name.startswith("geotask_model_adapter_reference/")
              for name in wheel_names
          )
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_names)
          required = (
              "/LICENSE",
              "/README.md",
              "/examples/openai_runtime_descriptor.json",
              "/examples/openai_runtime_request.json",
              "/examples/installed_smoke.py",
              "/src/geotask_openai_responses_adapter/provider.py",
              "/src/geotask_openai_responses_adapter/runtime.py",
          )
          assert all(any(name.endswith(item) for name in sdist_names) for item in required)
          PY
      - name: Smoke-test installed OpenAI Adapter stack
        shell: bash
        run: |
          python -m venv .venv-openai-adapter-smoke
          .venv-openai-adapter-smoke/bin/python -m pip install dist/*.whl
          .venv-openai-adapter-smoke/bin/python -m pip install --no-deps model-adapter-dist/*.whl openai-adapter-dist/*.whl
          .venv-openai-adapter-smoke/bin/python examples/model_adapters/openai_responses/examples/installed_smoke.py --repository-root .
      - name: Verify release identity and distribution versions
        run: python .release/verify_release_preflight.py --artifacts dist --format json
      - name: Verify built Schema Bundle distributions
        run: python .release/verify_schema_distribution.py dist --format json
      - name: Rebuild wheel from sdist and verify it
        shell: bash
        run: |
          mkdir dist-from-sdist
          python -m pip wheel --no-deps --wheel-dir dist-from-sdist dist/*.tar.gz
          cp dist/*.tar.gz dist-from-sdist/
          python .release/verify_schema_distribution.py dist-from-sdist
      - name: Smoke-test installed Schema Bundle CLI
        shell: bash
        run: |
          python -m venv .venv-schema-smoke
          .venv-schema-smoke/bin/python -m pip install dist-from-sdist/*.whl
          .venv-schema-smoke/bin/geotask schema verify --format json > schema-verification.json
          .venv-schema-smoke/bin/geotask schema export geotask.execution-result --compact > execution-result.schema.json
          .venv-schema-smoke/bin/geotask inspect schemas geotask.execution-result --verify --format json > schema-inspection.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.document examples/core/uav_arrival_ground_clearance_release.yaml --format json > document-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.observation examples/core/observation_uav_delay.json --format json > observation-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.world-state examples/core/world_state_uav_separation.json --format json > world-state-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.state-transition examples/core/state_transition_uav_separation_recheck.json --format json > state-transition-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.verification-session examples/core/verification_session_uav_recheck.json --format json > verification-session-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.discrepancy-report examples/core/discrepancy_report_uav_recheck.json --format json > discrepancy-report-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.correction-request examples/core/correction_request_uav_recheck.json --format json > correction-request-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.impact-graph examples/core/impact_graph_uav_recheck.json --format json > impact-graph-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.incremental-reevaluation-result examples/core/incremental_reevaluation_result_uav_recheck.json --format json > incremental-reevaluation-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.world-state-materialization-result examples/core/world_state_materialization_result_uav_recheck.json --format json > world-state-materialization-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.recompute-derivation-result examples/core/recompute_derivation_result_uav_recheck.json --format json > recompute-derivation-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.observation-merge-result examples/core/observation_merge_result_uav_recheck.json --format json > observation-merge-validation.json
          .venv-schema-smoke/bin/geotask run examples/core/uav_arrival_ground_clearance_release.yaml --format v1-json --output execution-result.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.execution-result execution-result.json --format json > result-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report result-validation.json --format json > validation-report-validation.json
          printf 'ground_zone_clear: false\nclearance_evidence_age_seconds: 8\n' > control-state.yaml
          .venv-schema-smoke/bin/geotask control evaluate examples/core/uav_arrival_ground_clearance_release.yaml --result execution-result.json --state control-state.yaml --output control-evaluation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.control-evaluation control-evaluation.json --format json > control-validation.json
          .venv-schema-smoke/bin/geotask agent inspect --format json > agent-profile.json
          .venv-schema-smoke/bin/geotask agent prepare examples/core/agent_generated_distance_draft.yaml --output agent-preparation.json --repaired-output prepared-generated.yaml --compact
          .venv-schema-smoke/bin/geotask artifact validate geotask.document prepared-generated.yaml --format json > prepared-document-validation.json
          set +e
          .venv-schema-smoke/bin/geotask agent prepare examples/core/agent_generated_distance_blocked.yaml --output blocked-preparation.json --compact
          blocked_exit=$?
          set -e
          test "$blocked_exit" -eq 2
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-generation-preparation blocked-preparation.json --format json > agent-preparation-validation.json
          .venv-schema-smoke/bin/geotask agent retry blocked-preparation.json examples/core/agent_generated_distance_revised.yaml --output revision-retry.json --verification-output revision-verification.json --prepared-output retried-prepared.yaml --compact
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-revision-verification revision-verification.json --format json > agent-verification-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-revision-retry revision-retry.json --format json > agent-retry-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report agent-retry-validation.json --format json > agent-validation-report-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.document retried-prepared.yaml --format json > retried-document-validation.json
          .venv-schema-smoke/bin/python -c 'import yaml; path="examples/core/agent_generated_distance_revised.yaml"; data=yaml.safe_load(open(path, encoding="utf-8")); data["objects"]["finish"]["coordinates"]=[6,8]; yaml.safe_dump(data, open("tampered-revision.yaml", "w", encoding="utf-8"), sort_keys=False)'
          set +e
          .venv-schema-smoke/bin/geotask agent retry blocked-preparation.json tampered-revision.yaml --output rejected-retry.json --prepared-output must-not-exist.yaml --compact
          rejected_exit=$?
          set -e
          test "$rejected_exit" -eq 2
          test ! -e must-not-exist.yaml
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-revision-retry rejected-retry.json --format json > rejected-agent-retry-validation.json
          .venv-schema-smoke/bin/geotask agent recover examples/core/evidence_request_plan.yaml --evidence examples/core/evidence_request_verified_state.yaml --compact > agent-recovery.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-evidence-recovery agent-recovery.json --format json > agent-recovery-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report agent-recovery-validation.json --format json > recovery-validation-report-validation.json
          .venv-schema-smoke/bin/geotask runtime inspect --format json > runtime-descriptor.json
          .venv-schema-smoke/bin/geotask runtime inspect --profile --format json > runtime-profile.json
          .venv-schema-smoke/bin/geotask runtime inspect examples/core/runtime_reference_descriptor.json --format json > runtime-file-inspection.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-descriptor runtime-descriptor.json --format json > runtime-descriptor-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-request examples/core/runtime_validate_artifact_request.json --format json > runtime-request-validation.json
          .venv-schema-smoke/bin/geotask runtime check examples/core/runtime_reference_descriptor.json examples/core/runtime_validate_artifact_request.json --format json > runtime-contract-check.json
          .venv-schema-smoke/bin/geotask runtime mock examples/core/runtime_validate_artifact_request.json --output runtime-response.json --compact
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-response runtime-response.json --format json > runtime-response-validation.json
          .venv-schema-smoke/bin/geotask provider inspect --profile --format json > provider-profile.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.verification-provider-descriptor examples/core/verification_provider_descriptor_authoritative_weather_gt29.json --format json > provider-descriptor-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.verification-request examples/core/verification_request_weather_conflict_gt29.json --format json > provider-request-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.verification-response examples/core/verification_response_authoritative_weather_gt29.json --format json > provider-response-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.assurance-profile examples/core/assurance_profile_weather_conflict_gt29.json --format json > assurance-profile-validation.json
          .venv-schema-smoke/bin/geotask provider check examples/core/verification_provider_descriptor_authoritative_weather_gt29.json examples/core/verification_request_weather_conflict_gt29.json --format json > provider-contract-check.json
          .venv-schema-smoke/bin/geotask provider validate examples/core/verification_response_authoritative_weather_gt29.json --request examples/core/verification_request_weather_conflict_gt29.json --descriptor examples/core/verification_provider_descriptor_authoritative_weather_gt29.json --format json > provider-response-binding.json
          .venv-schema-smoke/bin/geotask benchmark core --format json --output core-benchmark.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.core-benchmark-report core-benchmark.json --format json > core-benchmark-validation.json
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("schema-verification.json", encoding="utf-8"))["schema_bundle_verification"]; assert report["valid"] is True and report["checked_count"] == 28'
          .venv-schema-smoke/bin/python -c 'import json; schema=json.load(open("execution-result.schema.json", encoding="utf-8")); assert schema["$id"].endswith("geotask-result-v1.0.schema.json")'
          .venv-schema-smoke/bin/python -c 'import json; payload=json.load(open("schema-inspection.json", encoding="utf-8")); assert payload["artifact_registry"]["artifact_count"] == 1; report=payload["schema_bundle_verification"]; assert report["valid"] is True and report["checked_count"] == 1'
          .venv-schema-smoke/bin/python -c 'import json; profile=json.load(open("agent-profile.json", encoding="utf-8"))["agent_integration_profile"]; prep=profile["generated_document_preparation"]; artifacts=prep["report_artifacts"]; recovery=profile["evidence_recovery"]; assert profile["id"] == "geotask.agent-integration" and [tool["name"] for tool in profile["tools"]] == ["inspect_artifacts","validate_artifact","execute_task","evaluate_control"] and prep["repair_policy"] == "mechanical_only" and prep["revision_verification"]["requested_paths_only"] is True and prep["revision_verification"]["task_executed_before_acceptance"] is False and [item["artifact_id"] for item in artifacts] == ["geotask.agent-generation-preparation","geotask.agent-revision-verification","geotask.agent-revision-retry"] and prep["artifact_validity_is_distinct_from_business_state"] is True and recovery["artifact_id"] == "geotask.agent-evidence-recovery" and recovery["schema_version"] == "0.1" and recovery["artifact_validity_is_distinct_from_business_state"] is True'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("agent-preparation.json", encoding="utf-8"))["agent_generation_preparation"]; check=report["execution_result"]["geotask_result"]["checks"][0]; assert report["state"] == "repaired" and report["final_validation"]["valid"] is True and report["revision_request"]["state"] == "not_required" and report["repair_policy"]["model_called"] is False and report["repair_policy"]["domain_inference_used"] is False and check["value"] == 5.0 and check["status"] == "verified"'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("blocked-preparation.json", encoding="utf-8"))["agent_generation_preparation"]; request=report["revision_request"]; changes={item["code"]:item for item in request["required_changes"]}; assert report["state"] == "blocked" and request["state"] == "required" and request["next_action"] == "revise_generated_document" and changes["invalid_operator"]["selected_value"] is None and changes["invalid_reference"]["selected_value"] is None and request["automatic_revision_applied"] is False'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("revision-retry.json", encoding="utf-8"))["agent_revision_retry"]; verification=report["revision_verification"]; check=report["preparation"]["execution_result"]["geotask_result"]["checks"][0]; assert report["state"] == "accepted" and verification["state"] == "accepted" and verification["violations"] == [] and verification["policy"]["task_executed"] is False and report["summary"]["task_executed"] is True and check["value"] == 5.0 and check["status"] == "verified"'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("rejected-retry.json", encoding="utf-8"))["agent_revision_retry"]; violations=report["revision_verification"]["violations"]; assert report["state"] == "rejected" and report["preparation"] is None and report["summary"]["task_executed"] is False and any(item["code"] == "unauthorized_revision_path" and item["path"].startswith("objects.finish.coordinates") for item in violations)'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("prepared-document-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.document" and report["valid"] is True and report["schema_verified"] is True'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("retried-document-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.document" and report["valid"] is True and report["schema_verified"] is True'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("agent-recovery.json", encoding="utf-8"))["agent_integration"]; assert report["state"] == "recovered" and report["summary"]["decision_value"] is True and report["materialization"]["task_reexecuted"] is True and report["materialization"]["next_action_executed"] is False and report["materialization"]["model_guess_used"] is False'
          .venv-schema-smoke/bin/python -c 'import json; descriptor=json.load(open("runtime-descriptor.json", encoding="utf-8"))["runtime_descriptor"]; file_descriptor=json.load(open("runtime-file-inspection.json", encoding="utf-8"))["runtime_descriptor"]; profile=json.load(open("runtime-profile.json", encoding="utf-8"))["runtime_interface_profile"]; check=json.load(open("runtime-contract-check.json", encoding="utf-8"))["runtime_contract_check"]; response=json.load(open("runtime-response.json", encoding="utf-8"))["runtime_response"]; assert descriptor == file_descriptor and descriptor["runtime_id"] == "geotask.reference.fail-closed" and descriptor["production_ready"] is False and descriptor["external_side_effects_allowed"] is False; assert profile["private_implementation_excluded"] is True and profile["model_calls_in_reference_runtime"] is False and profile["offline_discovery"]["submits_request"] is False and profile["exchange_validation"]["input_cardinality_enforced"] is True and profile["exchange_validation"]["response_bound_to_descriptor_and_request"] is True; assert check["valid"] is True and check["submitted"] is False and check["side_effects_executed"] is False; assert response["state"] == "completed" and response["side_effects_executed"] is False and response["output_artifacts"][0]["artifact_id"] == "geotask.artifact-validation-report"'
          .venv-schema-smoke/bin/python -c 'import json; files=("document-validation.json","observation-validation.json","world-state-validation.json","state-transition-validation.json","verification-session-validation.json","discrepancy-report-validation.json","correction-request-validation.json","impact-graph-validation.json","incremental-reevaluation-validation.json","world-state-materialization-validation.json","recompute-derivation-validation.json","observation-merge-validation.json","result-validation.json","control-validation.json","agent-preparation-validation.json","agent-verification-validation.json","agent-retry-validation.json","agent-recovery-validation.json","runtime-descriptor-validation.json","runtime-request-validation.json","runtime-response-validation.json","provider-descriptor-validation.json","provider-request-validation.json","provider-response-validation.json","assurance-profile-validation.json","core-benchmark-validation.json","validation-report-validation.json"); reports=[json.load(open(path, encoding="utf-8"))["artifact_validation"] for path in files]; assert [r["artifact_id"] for r in reports] == ["geotask.document","geotask.observation","geotask.world-state","geotask.state-transition","geotask.verification-session","geotask.discrepancy-report","geotask.correction-request","geotask.impact-graph","geotask.incremental-reevaluation-result","geotask.world-state-materialization-result","geotask.recompute-derivation-result","geotask.observation-merge-result","geotask.execution-result","geotask.control-evaluation","geotask.agent-generation-preparation","geotask.agent-revision-verification","geotask.agent-revision-retry","geotask.agent-evidence-recovery","geotask.runtime-descriptor","geotask.runtime-request","geotask.runtime-response","geotask.verification-provider-descriptor","geotask.verification-request","geotask.verification-response","geotask.assurance-profile","geotask.core-benchmark-report","geotask.artifact-validation-report"]; assert all(r["valid"] is True and r["schema_verified"] is True for r in reports)'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("rejected-agent-retry-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.agent-revision-retry" and report["valid"] is True and report["summary"]["report_state"] == "rejected"'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("agent-validation-report-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.artifact-validation-report" and report["valid"] is True and report["summary"]["validated_artifact_id"] == "geotask.agent-revision-retry"'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("recovery-validation-report-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.artifact-validation-report" and report["valid"] is True and report["summary"]["validated_artifact_id"] == "geotask.agent-evidence-recovery"'

      - name: Upload Core RC distributions
        uses: actions/upload-artifact@v7
        with:
          name: geotask-core-rc-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  rc-build-evidence:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Download exact Core distributions
        uses: actions/download-artifact@v8
        with:
          name: geotask-core-rc-dist
          path: /tmp/geotask-core-rc-dist
      - name: Install exact wheel for Reference Agent replay
        shell: bash
        run: |
          python -m venv /tmp/geotask-rc-install
          /tmp/geotask-rc-install/bin/python -m pip install /tmp/geotask-core-rc-dist/*.whl
      - name: Collect build/public/Reference Agent RC evidence shard
        run: python .release/collect_rc_evidence.py collect --target-version 0.4.0 --artifacts /tmp/geotask-core-rc-dist --public-export /tmp/geotask-public-rc-evidence --reference-python /tmp/geotask-rc-install/bin/python --output /tmp/rc-evidence-build.json
      - name: Upload build RC evidence shard
        uses: actions/upload-artifact@v7
        with:
          name: geotask-rc-evidence-build
          path: /tmp/rc-evidence-build.json
          if-no-files-found: error
          retention-days: 14

  rc-evidence-merge:
    runs-on: ubuntu-latest
    needs: [test, rc-build-evidence]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Download Python 3.10 evidence
        uses: actions/download-artifact@v8
        with:
          name: geotask-rc-evidence-3.10
          path: /tmp/geotask-rc-evidence
      - name: Download Python 3.11 evidence
        uses: actions/download-artifact@v8
        with:
          name: geotask-rc-evidence-3.11
          path: /tmp/geotask-rc-evidence
      - name: Download Python 3.12 evidence
        uses: actions/download-artifact@v8
        with:
          name: geotask-rc-evidence-3.12
          path: /tmp/geotask-rc-evidence
      - name: Download Python 3.13 evidence
        uses: actions/download-artifact@v8
        with:
          name: geotask-rc-evidence-3.13
          path: /tmp/geotask-rc-evidence
      - name: Download build evidence
        uses: actions/download-artifact@v8
        with:
          name: geotask-rc-evidence-build
          path: /tmp/geotask-rc-evidence
      - name: Download exact Core distributions
        uses: actions/download-artifact@v8
        with:
          name: geotask-core-rc-dist
          path: /tmp/geotask-core-rc-dist
      - name: Merge exact-commit RC evidence
        run: python .release/collect_rc_evidence.py merge /tmp/geotask-rc-evidence/rc-evidence-3.10.json /tmp/geotask-rc-evidence/rc-evidence-3.11.json /tmp/geotask-rc-evidence/rc-evidence-3.12.json /tmp/geotask-rc-evidence/rc-evidence-3.13.json /tmp/geotask-rc-evidence/rc-evidence-build.json --output /tmp/geotask-rc-evidence/rc-evidence.json
      - name: Audit merged RC readiness without treating pending as CI failure
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          command = [
              sys.executable,
              ".release/verify_rc_readiness.py",
              "--target-version",
              "0.4.0",
              "--artifacts",
              "/tmp/geotask-core-rc-dist",
              "--evidence",
              "/tmp/geotask-rc-evidence/rc-evidence.json",
              "--format",
              "json",
          ]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          pathlib.Path("/tmp/geotask-rc-evidence/rc-readiness.json").write_text(result.stdout, encoding="utf-8")
          if result.stderr:
              sys.stderr.write(result.stderr)
          if result.returncode not in (0, 2):
              raise SystemExit(result.returncode)
          PY
      - name: Upload merged RC evidence and readiness report
        uses: actions/upload-artifact@v7
        with:
          name: geotask-rc-evidence-merged
          path: |
            /tmp/geotask-rc-evidence/rc-evidence.json
            /tmp/geotask-rc-evidence/rc-readiness.json
          if-no-files-found: error
          retention-days: 14

  artifact-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Create release artifact fixture
        shell: bash
        run: |
          mkdir artifact-source
          printf 'geotask-release-artifact-roundtrip\n' > artifact-source/payload.txt
          sha256sum artifact-source/payload.txt > expected.sha256
      - name: Upload release artifact fixture
        uses: actions/upload-artifact@v7
        with:
          name: geotask-release-artifact-roundtrip
          path: artifact-source/
          if-no-files-found: error
          retention-days: 1
      - name: Remove source fixture
        run: rm -rf artifact-source
      - name: Download release artifact fixture
        uses: actions/download-artifact@v8
        with:
          name: geotask-release-artifact-roundtrip
          path: artifact-download
      - name: Verify release artifact roundtrip
        shell: bash
        run: |
          actual="$(sha256sum artifact-download/payload.txt | cut -d ' ' -f1)"
          expected="$(cut -d ' ' -f1 expected.sha256)"
          test "$actual" = "$expected"

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python .release/release_public.py /tmp/geotask-public-scan --clean --skip-tests
      - run: python .release/scan_public_export.py /tmp/geotask-public-scan

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python .release/release_public.py /tmp/geotask-public-boundary --clean --skip-tests
      - run: python .release/verify_public_export.py /tmp/geotask-public-boundary
