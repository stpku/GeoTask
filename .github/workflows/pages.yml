name: Deploy GeoTask project portal

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "cases/catalog.yaml"
      - "tools/generate_case_catalog.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install portal generator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"

      - name: Verify catalog-generated portal files
        run: python tools/generate_case_catalog.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
