name: Publish geotask-core to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-geotask-core-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package-version.outputs.version }}
      already_exists: ${{ steps.pypi-check.outputs.already_exists }}
    steps:
      - name: Verify workflow dispatch branch
        shell: bash
        env:
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DISPATCH_REF_TYPE" != "branch" ]; then
            echo "PyPI publication must be dispatched from the default branch." >&2
            exit 1
          fi
          if [ "$DISPATCH_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Select the default branch $DEFAULT_BRANCH, got $DISPATCH_REF_NAME." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify checked-out release tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          expected_tag="v$EXPECTED_VERSION"
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$expected_tag")"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "Checked-out commit $head_commit does not match $expected_tag ($tag_commit)." >&2
            exit 1
          fi
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release identity and distribution versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: >-
          python .release/verify_release_preflight.py
          --expected-version "$EXPECTED_VERSION"
          --expected-tag "v$EXPECTED_VERSION"
          --artifacts dist
          --format json
      - name: Verify Schema Bundle distributions
        run: python .release/verify_schema_distribution.py dist --format json
      - name: Smoke-test package selected for publication
        shell: bash
        run: |
          python -m venv .venv-schema-smoke
          .venv-schema-smoke/bin/python -m pip install dist/*.whl
          .venv-schema-smoke/bin/geotask schema verify --format json > schema-verification.json
          .venv-schema-smoke/bin/geotask schema export geotask.execution-result --compact > execution-result.schema.json
          .venv-schema-smoke/bin/geotask inspect schemas geotask.execution-result --verify --format json > schema-inspection.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.document examples/core/uav_arrival_ground_clearance_release.yaml --format json > document-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.observation examples/core/observation_uav_delay.json --format json > observation-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.world-state examples/core/world_state_uav_separation.json --format json > world-state-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.state-transition examples/core/state_transition_uav_separation_recheck.json --format json > state-transition-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.verification-session examples/core/verification_session_uav_recheck.json --format json > verification-session-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.discrepancy-report examples/core/discrepancy_report_uav_recheck.json --format json > discrepancy-report-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.correction-request examples/core/correction_request_uav_recheck.json --format json > correction-request-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.impact-graph examples/core/impact_graph_uav_recheck.json --format json > impact-graph-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.incremental-reevaluation-result examples/core/incremental_reevaluation_result_uav_recheck.json --format json > incremental-reevaluation-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.world-state-materialization-result examples/core/world_state_materialization_result_uav_recheck.json --format json > world-state-materialization-validation.json
          .venv-schema-smoke/bin/geotask run examples/core/uav_arrival_ground_clearance_release.yaml --format v1-json --output execution-result.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.execution-result execution-result.json --format json > result-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report result-validation.json --format json > validation-report-validation.json
          printf 'ground_zone_clear: false\nclearance_evidence_age_seconds: 8\n' > control-state.yaml
          .venv-schema-smoke/bin/geotask control evaluate examples/core/uav_arrival_ground_clearance_release.yaml --result execution-result.json --state control-state.yaml --output control-evaluation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.control-evaluation control-evaluation.json --format json > control-validation.json
          set +e
          .venv-schema-smoke/bin/geotask agent prepare examples/core/agent_generated_distance_blocked.yaml --output blocked-preparation.json --compact
          blocked_exit=$?
          set -e
          test "$blocked_exit" -eq 2
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-generation-preparation blocked-preparation.json --format json > agent-preparation-validation.json
          .venv-schema-smoke/bin/geotask agent retry blocked-preparation.json examples/core/agent_generated_distance_revised.yaml --output revision-retry.json --verification-output revision-verification.json --prepared-output retried-prepared.yaml --compact
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-revision-verification revision-verification.json --format json > agent-verification-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-revision-retry revision-retry.json --format json > agent-retry-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report agent-retry-validation.json --format json > agent-validation-report-validation.json
          .venv-schema-smoke/bin/geotask agent recover examples/core/evidence_request_plan.yaml --evidence examples/core/evidence_request_verified_state.yaml --compact > agent-recovery.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.agent-evidence-recovery agent-recovery.json --format json > agent-recovery-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.artifact-validation-report agent-recovery-validation.json --format json > recovery-validation-report-validation.json
          .venv-schema-smoke/bin/geotask runtime inspect --format json > runtime-descriptor.json
          .venv-schema-smoke/bin/geotask runtime inspect --profile --format json > runtime-profile.json
          .venv-schema-smoke/bin/geotask runtime inspect examples/core/runtime_reference_descriptor.json --format json > runtime-file-inspection.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-descriptor runtime-descriptor.json --format json > runtime-descriptor-validation.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-request examples/core/runtime_validate_artifact_request.json --format json > runtime-request-validation.json
          .venv-schema-smoke/bin/geotask runtime check examples/core/runtime_reference_descriptor.json examples/core/runtime_validate_artifact_request.json --format json > runtime-contract-check.json
          .venv-schema-smoke/bin/geotask runtime mock examples/core/runtime_validate_artifact_request.json --output runtime-response.json --compact
          .venv-schema-smoke/bin/geotask artifact validate geotask.runtime-response runtime-response.json --format json > runtime-response-validation.json
          .venv-schema-smoke/bin/geotask benchmark core --format json --output core-benchmark.json
          .venv-schema-smoke/bin/geotask artifact validate geotask.core-benchmark-report core-benchmark.json --format json > core-benchmark-validation.json
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("schema-verification.json", encoding="utf-8"))["schema_bundle_verification"]; assert report["valid"] is True and report["checked_count"] == 22'
          .venv-schema-smoke/bin/python -c 'import json; schema=json.load(open("execution-result.schema.json", encoding="utf-8")); assert schema["$id"].endswith("geotask-result-v1.0.schema.json")'
          .venv-schema-smoke/bin/python -c 'import json; payload=json.load(open("schema-inspection.json", encoding="utf-8")); assert payload["artifact_registry"]["artifact_count"] == 1; report=payload["schema_bundle_verification"]; assert report["valid"] is True and report["checked_count"] == 1'
          .venv-schema-smoke/bin/python -c 'import json; descriptor=json.load(open("runtime-descriptor.json", encoding="utf-8"))["runtime_descriptor"]; file_descriptor=json.load(open("runtime-file-inspection.json", encoding="utf-8"))["runtime_descriptor"]; profile=json.load(open("runtime-profile.json", encoding="utf-8"))["runtime_interface_profile"]; check=json.load(open("runtime-contract-check.json", encoding="utf-8"))["runtime_contract_check"]; response=json.load(open("runtime-response.json", encoding="utf-8"))["runtime_response"]; assert descriptor == file_descriptor and descriptor["runtime_id"] == "geotask.reference.fail-closed" and descriptor["production_ready"] is False and descriptor["external_side_effects_allowed"] is False; assert profile["private_implementation_excluded"] is True and profile["model_calls_in_reference_runtime"] is False and profile["offline_discovery"]["submits_request"] is False and profile["exchange_validation"]["input_cardinality_enforced"] is True and profile["exchange_validation"]["response_bound_to_descriptor_and_request"] is True; assert check["valid"] is True and check["submitted"] is False and check["side_effects_executed"] is False; assert response["state"] == "completed" and response["side_effects_executed"] is False and response["output_artifacts"][0]["artifact_id"] == "geotask.artifact-validation-report"'
          .venv-schema-smoke/bin/python -c 'import json; files=("document-validation.json","observation-validation.json","world-state-validation.json","state-transition-validation.json","verification-session-validation.json","discrepancy-report-validation.json","correction-request-validation.json","impact-graph-validation.json","incremental-reevaluation-validation.json","world-state-materialization-validation.json","result-validation.json","control-validation.json","agent-preparation-validation.json","agent-verification-validation.json","agent-retry-validation.json","agent-recovery-validation.json","runtime-descriptor-validation.json","runtime-request-validation.json","runtime-response-validation.json","core-benchmark-validation.json","validation-report-validation.json"); reports=[json.load(open(path, encoding="utf-8"))["artifact_validation"] for path in files]; assert [r["artifact_id"] for r in reports] == ["geotask.document","geotask.observation","geotask.world-state","geotask.state-transition","geotask.verification-session","geotask.discrepancy-report","geotask.correction-request","geotask.impact-graph","geotask.incremental-reevaluation-result","geotask.world-state-materialization-result","geotask.execution-result","geotask.control-evaluation","geotask.agent-generation-preparation","geotask.agent-revision-verification","geotask.agent-revision-retry","geotask.agent-evidence-recovery","geotask.runtime-descriptor","geotask.runtime-request","geotask.runtime-response","geotask.core-benchmark-report","geotask.artifact-validation-report"]; assert all(r["valid"] is True and r["schema_verified"] is True for r in reports)'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("agent-validation-report-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.artifact-validation-report" and report["valid"] is True and report["summary"]["validated_artifact_id"] == "geotask.agent-revision-retry"'
          .venv-schema-smoke/bin/python -c 'import json; report=json.load(open("recovery-validation-report-validation.json", encoding="utf-8"))["artifact_validation"]; assert report["artifact_id"] == "geotask.artifact-validation-report" and report["valid"] is True and report["summary"]["validated_artifact_id"] == "geotask.agent-evidence-recovery"'
      - id: package-version
        name: Read package version
        shell: bash
        run: |
          package_version="$(python3 - <<'PY'
          import runpy
          print(runpy.run_path("src/geotask_core/_version.py")["__version__"])
          PY
          )"
          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
      - id: pypi-check
        name: Check whether version already exists on PyPI
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/geotask-core/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              exists = "false"
          else:
              exists = "true"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"already_exists={exists}\n")
          print(f"geotask-core {version} already exists on PyPI: {exists}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geotask-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
