name: resolution-fine-fixture-once

on:
  push:
    branches:
      - feat/task-context-resolution-stress-v0.1
    paths:
      - .github/workflows/resolution-fine-fixture-once.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e . rasterio
      - name: Acquire and normalize frozen 3DEP fine raster
        run: |
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import hashlib
          import json
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          import numpy as np
          import rasterio
          from rasterio.io import MemoryFile

          from benchmarks.resolution_stress.experiment_spec import (
              ANALYSIS_CRS_WKID,
              FINE_GRID_HEIGHT,
              FINE_GRID_WIDTH,
              FINE_PIXEL_SIZE_METERS,
              SOURCE_CANDIDATE_ID,
              SOURCE_EXPORT_INTERPOLATION,
              SOURCE_FAMILY,
              SOURCE_SERVICE,
          )
          from benchmarks.resolution_stress.usgs_acquisition import (
              build_export_image_metadata_url,
              frozen_roi_bbox_3857,
          )

          root = Path("benchmarks/resolution_stress/fixtures/usgs_3dep_south_mountain_20260818")
          root.mkdir(parents=True, exist_ok=True)

          def digest(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          def fetch(url: str) -> tuple[bytes, float, str | None]:
              request = Request(
                  url,
                  headers={"User-Agent": "GeoTask-Resolution-Stress/0.1 (+https://github.com/stpku/GeoTask)"},
                  method="GET",
              )
              started = time.perf_counter()
              with urlopen(request, timeout=120) as response:
                  payload = response.read()
                  content_type = response.headers.get("Content-Type")
              return payload, time.perf_counter() - started, content_type

          try:
              metadata_url = build_export_image_metadata_url()
              metadata_payload, metadata_seconds, metadata_content_type = fetch(metadata_url)
              metadata = json.loads(metadata_payload.decode("utf-8"))
              if not isinstance(metadata, dict) or "error" in metadata:
                  raise RuntimeError(f"3DEP export metadata error: {metadata!r}")
              href = metadata.get("href")
              if not isinstance(href, str) or not href.startswith("https://"):
                  raise RuntimeError("3DEP export metadata did not return an HTTPS href")

              raster_payload, raster_seconds, raster_content_type = fetch(href)
              if len(raster_payload) < 1024:
                  raise RuntimeError("3DEP raster payload is unexpectedly small")

              raw_path = root / "fine-reference.tif"
              raw_path.write_bytes(raster_payload)

              with MemoryFile(raster_payload) as memfile:
                  with memfile.open() as dataset:
                      if dataset.width != FINE_GRID_WIDTH or dataset.height != FINE_GRID_HEIGHT:
                          raise RuntimeError(
                              f"unexpected raster dimensions: {dataset.width}x{dataset.height}"
                          )
                      if dataset.count != 1:
                          raise RuntimeError(f"expected one elevation band, got {dataset.count}")
                      if dataset.crs is None or dataset.crs.to_epsg() != ANALYSIS_CRS_WKID:
                          raise RuntimeError(f"unexpected raster CRS: {dataset.crs}")
                      x_resolution = abs(float(dataset.transform.a))
                      y_resolution = abs(float(dataset.transform.e))
                      if abs(x_resolution - FINE_PIXEL_SIZE_METERS) > 1e-3:
                          raise RuntimeError(f"unexpected x pixel size: {x_resolution}")
                      if abs(y_resolution - FINE_PIXEL_SIZE_METERS) > 1e-3:
                          raise RuntimeError(f"unexpected y pixel size: {y_resolution}")

                      masked = dataset.read(1, masked=True)
                      if np.ma.isMaskedArray(masked) and np.any(masked.mask):
                          raise RuntimeError(
                              f"fine reference contains masked/NoData cells: {int(np.sum(masked.mask))}"
                          )
                      values = np.asarray(masked, dtype=np.float32)
                      if values.shape != (FINE_GRID_HEIGHT, FINE_GRID_WIDTH):
                          raise RuntimeError(f"unexpected array shape: {values.shape}")
                      if not np.isfinite(values).all():
                          raise RuntimeError("fine reference contains non-finite cells")

                      # Raster row 0 is north/top. The benchmark local grid uses
                      # y=0 at the south/lower-left origin, so normalize once and
                      # pin that orientation for all coarse derivations.
                      normalized = np.flipud(values).astype("<f4", copy=False)
                      normalized_bytes = normalized.tobytes(order="C")
                      with gzip.open(root / "fine-grid.f32.gz", "wb", compresslevel=9) as handle:
                          handle.write(normalized_bytes)

                      summary = {
                          "stage": "FINE_REFERENCE_ACQUIRED",
                          "source_family": SOURCE_FAMILY,
                          "source_candidate_id": SOURCE_CANDIDATE_ID,
                          "source_service": SOURCE_SERVICE,
                          "metadata_request_url": metadata_url,
                          "metadata_response_sha256": digest(metadata_payload),
                          "metadata_response_bytes": len(metadata_payload),
                          "metadata_content_type": metadata_content_type,
                          "metadata_wall_clock_seconds": metadata_seconds,
                          "export_href": href,
                          "raster_sha256": digest(raster_payload),
                          "raster_bytes": len(raster_payload),
                          "raster_content_type": raster_content_type,
                          "raster_wall_clock_seconds": raster_seconds,
                          "grid_sha256": digest(normalized_bytes),
                          "grid_uncompressed_bytes": len(normalized_bytes),
                          "width": dataset.width,
                          "height": dataset.height,
                          "band_count": dataset.count,
                          "dtype": str(dataset.dtypes[0]),
                          "crs": str(dataset.crs),
                          "x_resolution_meters": x_resolution,
                          "y_resolution_meters": y_resolution,
                          "source_transform": [float(value) for value in dataset.transform[:6]],
                          "roi_bbox_3857": list(frozen_roi_bbox_3857()),
                          "interpolation": SOURCE_EXPORT_INTERPOLATION,
                          "minimum_elevation_meters": float(normalized.min()),
                          "maximum_elevation_meters": float(normalized.max()),
                          "mean_elevation_meters": float(normalized.mean()),
                          "nodata": dataset.nodata,
                          "masked_cell_count": 0,
                          "orientation": "row-major; row 0 = south; column 0 = west",
                          "raw_source_records_committed": True,
                      }

              (root / "record.json").write_text(
                  json.dumps(summary, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          except Exception as exc:
              (root / "failure.json").write_text(
                  json.dumps(
                      {
                          "stage": "FAILED",
                          "error_type": type(exc).__name__,
                          "error": str(exc),
                          "source_service": SOURCE_SERVICE,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              raise
          PY
      - name: Commit fixture or failure and remove one-shot workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resolution-fine-fixture-once.yml
          git add benchmarks/resolution_stress/fixtures/usgs_3dep_south_mountain_20260818/
          git commit -m "data: record pinned 3DEP fine resolution fixture"
          git push
