name: resolution-real-score-once

on:
  push:
    branches:
      - feat/task-context-resolution-stress-v0.1
    paths:
      - .github/workflows/resolution-real-score-once.yml

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Run every frozen real resolution case
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from benchmarks.resolution_stress.real_runner import (
              run_real_resolution_stress,
              summary_to_jsonable,
          )

          fixture_root = Path(
              "benchmarks/resolution_stress/fixtures/"
              "usgs_3dep_south_mountain_20260818"
          )
          summary = run_real_resolution_stress(fixture_root)
          output = fixture_root / "real-result.json"
          output.write_text(
              json.dumps(summary_to_jsonable(summary), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "total_cases": summary.total_cases,
                      "coarse_stop_case_count": summary.coarse_stop_case_count,
                      "refinement_case_count": summary.refinement_case_count,
                      "unsafe_stop_count": summary.unsafe_stop_count,
                      "unnecessary_refinement_count": summary.unnecessary_refinement_count,
                      "final_resolution_counts": summary.final_resolution_counts,
                      "adaptive_cells_evaluated": summary.adaptive_cells_evaluated,
                      "always_finest_cells_evaluated": summary.always_finest_cells_evaluated,
                      "cell_evaluation_reduction_ratio": summary.cell_evaluation_reduction_ratio,
                      "promotion_stress_gate_pass": summary.promotion_stress_gate_pass,
                  },
                  sort_keys=True,
              )
          )
          PY
      - name: Commit result and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resolution-real-score-once.yml
          git add benchmarks/resolution_stress/fixtures/usgs_3dep_south_mountain_20260818/real-result.json
          git commit -m "data: record real resolution stress result"
          git push
