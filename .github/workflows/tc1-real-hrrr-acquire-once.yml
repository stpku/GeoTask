name: tc1-real-hrrr-acquire-once

on:
  push:
    branches:
      - acquire/tc1-real-hrrr-20260818
    paths:
      - .github/workflows/tc1-real-hrrr-acquire-once.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: acquire/tc1-real-hrrr-20260818
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Acquire and validate paired HRRR subsets
        run: |
          rm -rf tc1-real-hrrr-evidence
          mkdir -p tc1-real-hrrr-evidence
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import traceback

          from benchmarks.tc1_real.hrrr_acquisition import acquire_hrrr_subset

          root = Path("tc1-real-hrrr-evidence")
          common = dict(
              date="20260818",
              cycle=6,
              forecast_hour=4,
              variables=("UGRD", "VGRD", "VIS"),
              levels=("10_m_above_ground", "surface"),
          )
          diagnostic = {
              "status": "started",
              "request": {
                  "date": common["date"],
                  "cycle_utc": common["cycle"],
                  "forecast_hour": common["forecast_hour"],
                  "variables": list(common["variables"]),
                  "levels": list(common["levels"]),
                  "task_bbox": [-112.10, 33.40, -112.00, 33.50],
                  "r0_bbox": [-112.20, 33.30, -111.90, 33.60],
              },
          }

          try:
              acquire_hrrr_subset(
                  **common,
                  bbox=(-112.10, 33.40, -112.00, 33.50),
                  output_path=root / "hrrr-task.grib2",
                  record_path=root / "hrrr-task.record.json",
              )
              acquire_hrrr_subset(
                  **common,
                  bbox=(-112.20, 33.30, -111.90, 33.60),
                  output_path=root / "hrrr-r0-regional.grib2",
                  record_path=root / "hrrr-r0-regional.record.json",
              )

              task_payload = (root / "hrrr-task.grib2").read_bytes()
              r0_payload = (root / "hrrr-r0-regional.grib2").read_bytes()
              task_record = json.loads(
                  (root / "hrrr-task.record.json").read_text(encoding="utf-8")
              )
              r0_record = json.loads(
                  (root / "hrrr-r0-regional.record.json").read_text(encoding="utf-8")
              )

              for payload, record, label in (
                  (task_payload, task_record, "task"),
                  (r0_payload, r0_record, "r0"),
              ):
                  digest = hashlib.sha256(payload).hexdigest()
                  if record["provenance"]["content_sha256"] != digest:
                      raise RuntimeError(f"{label} HRRR SHA mismatch")
                  if record["measurement"]["bytes_transferred"] != len(payload):
                      raise RuntimeError(f"{label} HRRR byte-count mismatch")
                  if payload[:4] != b"GRIB" or payload[7] != 2:
                      raise RuntimeError(f"{label} payload is not GRIB2")

              task_params = task_record["provenance"]["request_parameters"]
              r0_params = r0_record["provenance"]["request_parameters"]
              for key in ("date", "cycle_utc", "forecast_hour", "variables", "levels"):
                  if task_params[key] != r0_params[key]:
                      raise RuntimeError(f"HRRR task/R0 mismatch in {key}")
              if (
                  task_record["provenance"]["source_effective_at"]
                  != r0_record["provenance"]["source_effective_at"]
              ):
                  raise RuntimeError("HRRR task/R0 run time mismatch")
              if (
                  task_record["provenance"]["valid_from"]
                  != r0_record["provenance"]["valid_from"]
              ):
                  raise RuntimeError("HRRR task/R0 valid time mismatch")

              summary = {
                  "date": task_params["date"],
                  "cycle_utc": task_params["cycle_utc"],
                  "forecast_hour": task_params["forecast_hour"],
                  "run_time": task_record["provenance"]["source_effective_at"],
                  "valid_time": task_record["provenance"]["valid_from"],
                  "variables": task_params["variables"],
                  "levels": task_params["levels"],
                  "task_bbox": task_params["bbox"],
                  "r0_bbox": r0_params["bbox"],
                  "task_bytes": len(task_payload),
                  "r0_bytes": len(r0_payload),
                  "task_sha256": hashlib.sha256(task_payload).hexdigest(),
                  "r0_sha256": hashlib.sha256(r0_payload).hexdigest(),
                  "task_wall_clock_seconds": task_record["measurement"]["wall_clock_seconds"],
                  "r0_wall_clock_seconds": r0_record["measurement"]["wall_clock_seconds"],
                  "task_request_count": task_record["measurement"]["request_count"],
                  "r0_request_count": r0_record["measurement"]["request_count"],
                  "task_monetary_cost": task_record["measurement"]["monetary_cost"],
                  "r0_monetary_cost": r0_record["measurement"]["monetary_cost"],
                  "byte_reduction_ratio": 1 - (len(task_payload) / len(r0_payload)),
              }
              (root / "summary.json").write_text(
                  json.dumps(summary, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              diagnostic["status"] = "success"
              diagnostic["summary"] = summary
          except Exception as exc:  # diagnostic-only one-time workflow
              diagnostic["status"] = "failure"
              diagnostic["error_type"] = type(exc).__name__
              diagnostic["error"] = str(exc)
              diagnostic["traceback"] = traceback.format_exc()

          (root / "diagnostic.json").write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(diagnostic, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: tc1-real-hrrr-paired-20260818
          path: tc1-real-hrrr-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Persist exact evidence or failure diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc1-real-hrrr-evidence/
          git commit -m "data: record HRRR paired acquisition attempt [skip ci]"
          git push origin HEAD:acquire/tc1-real-hrrr-20260818
      - name: Fail workflow when acquisition failed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          diagnostic = json.loads(
              Path("tc1-real-hrrr-evidence/diagnostic.json").read_text(encoding="utf-8")
          )
          if diagnostic["status"] != "success":
              raise SystemExit(
                  f"HRRR acquisition failed: {diagnostic.get('error_type')}: "
                  f"{diagnostic.get('error')}"
              )
          PY
