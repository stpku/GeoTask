name: tc1-real-planning-popselected-once

on:
  push:
    branches:
      - acquire/tc1-real-planning-phx-popselected-20260818
    paths:
      - .github/workflows/tc1-real-planning-popselected-once.yml

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Measure frozen HHPop 2030 coverage
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          from benchmarks.tc1_real.spatial_planning.arcgis_acquisition import (
              build_object_ids_query_url,
              build_spatial_ids_query_url,
              build_table_ids_query_url,
              chunk_object_ids,
              extract_object_ids,
          )
          from benchmarks.tc1_real.spatial_planning.experiment_spec import (
              FROZEN_POPULATION_VARIABLE,
              FROZEN_POPULATION_VARIABLE_SOURCE_DESCRIPTION,
              FROZEN_POPULATION_YEAR,
              R0_BROAD_BBOX,
              TASK_BBOX,
          )
          from benchmarks.tc1_real.spatial_planning.population_selection import build_frozen_population_where
          from benchmarks.tc1_real.spatial_planning.source_profiles import (
              PHX_GROWTH_BASE_LAYER_ID,
              PHX_GROWTH_POPULATION_TABLE_ID,
              PHX_GROWTH_PROJECTIONS,
          )

          def digest(payload): return hashlib.sha256(payload).hexdigest()
          def set_digest(values): return digest(",".join(str(v) for v in sorted(set(values))).encode())
          def fetch(url):
              req=Request(url,headers={"User-Agent":"GeoTask-TC1-Real/0.1 (+https://github.com/stpku/GeoTask)"},method="GET")
              start=time.perf_counter()
              with urlopen(req,timeout=60) as response: payload=response.read()
              elapsed=time.perf_counter()-start
              doc=json.loads(payload.decode("utf-8"))
              if not isinstance(doc,dict) or "error" in doc: raise SystemExit(f"ArcGIS error: {doc!r}")
              return payload,doc,elapsed

          base=PHX_GROWTH_PROJECTIONS.observed_machine_endpoint+f"/{PHX_GROWTH_BASE_LAYER_ID}"
          table=PHX_GROWTH_PROJECTIONS.observed_machine_endpoint+f"/{PHX_GROWTH_POPULATION_TABLE_ID}"
          result={"population_variable":FROZEN_POPULATION_VARIABLE,"source_description":FROZEN_POPULATION_VARIABLE_SOURCE_DESCRIPTION,"year":FROZEN_POPULATION_YEAR,"raw_source_records_committed":False,"scopes":{}}

          for name,bbox in (("broad",R0_BROAD_BBOX),("task",TASK_BBOX)):
              ids_payload,_,ids_time=fetch(build_spatial_ids_query_url(layer_endpoint=base,bbox=bbox))
              unit_oids=extract_object_ids(ids_payload)
              units=set()
              unit_page_bytes=0; unit_page_time=0.0
              for chunk in chunk_object_ids(unit_oids,chunk_size=1000):
                  url=build_object_ids_query_url(layer_endpoint=base,object_ids=chunk,out_fields=("objectid","newluau"),return_geometry=False,output_format="json")
                  payload,doc,elapsed=fetch(url); unit_page_bytes+=len(payload); unit_page_time+=elapsed
                  features=doc.get("features")
                  if not isinstance(features,list): raise SystemExit("unit page has no features")
                  for feature in features:
                      attrs=feature.get("attributes") if isinstance(feature,dict) else None
                      if not isinstance(attrs,dict): continue
                      units.add(int(attrs["newluau"]))
              if len(units)!=len(unit_oids): raise SystemExit(f"{name}: base-unit/newluau cardinality mismatch")

              where=build_frozen_population_where(units)
              pop_ids_payload,_,pop_ids_time=fetch(build_table_ids_query_url(table_endpoint=table,where=where))
              pop_oids=extract_object_ids(pop_ids_payload)
              covered=set(); retrieved=set(); pop_page_bytes=0; pop_page_time=0.0; page_hashes=[]
              for chunk in chunk_object_ids(pop_oids,chunk_size=1000):
                  url=build_object_ids_query_url(layer_endpoint=table,object_ids=chunk,out_fields=("objectid","newluau","popvar","vardesc","year","popcount"),return_geometry=False,output_format="json")
                  payload,doc,elapsed=fetch(url); pop_page_bytes+=len(payload); pop_page_time+=elapsed; page_hashes.append(digest(payload))
                  features=doc.get("features")
                  if not isinstance(features,list): raise SystemExit("population page has no features")
                  for feature in features:
                      attrs=feature.get("attributes") if isinstance(feature,dict) else None
                      if not isinstance(attrs,dict): continue
                      oid=int(attrs["objectid"]); retrieved.add(oid)
                      if str(attrs.get("popvar"))!=FROZEN_POPULATION_VARIABLE: raise SystemExit("popvar mismatch")
                      if int(attrs["year"])!=FROZEN_POPULATION_YEAR: raise SystemExit("year mismatch")
                      if str(attrs.get("vardesc"))!=FROZEN_POPULATION_VARIABLE_SOURCE_DESCRIPTION: raise SystemExit("vardesc mismatch")
                      covered.add(int(attrs["newluau"]))
              if retrieved!=set(pop_oids): raise SystemExit(f"{name}: population OID completeness mismatch")
              missing=units-covered; extra=covered-units
              if missing or extra: raise SystemExit(f"{name}: P1 coverage mismatch missing={len(missing)} extra={len(extra)}")
              result["scopes"][name]={
                  "base_unit_count":len(units),"base_unit_set_sha256":set_digest(units),
                  "population_row_count":len(pop_oids),"population_id_set_sha256":set_digest(pop_oids),
                  "covered_unit_count":len(covered),"missing_unit_count":0,"extra_unit_count":0,
                  "population_ids_response_bytes":len(pop_ids_payload),"population_page_bytes":pop_page_bytes,
                  "population_network_bytes":len(pop_ids_payload)+pop_page_bytes,
                  "population_carried_bytes":pop_page_bytes,
                  "population_request_count":1+len(chunk_object_ids(pop_oids,chunk_size=1000)),
                  "population_wall_clock_seconds":pop_ids_time+pop_page_time,
                  "population_ids_sha256":digest(pop_ids_payload),"population_page_hashes":page_hashes,
                  "base_unit_lookup_network_bytes":len(ids_payload)+unit_page_bytes,
                  "base_unit_lookup_wall_clock_seconds":ids_time+unit_page_time,
                  "complete":True,
              }

          root=Path("tc1-real-planning-popselected"); root.mkdir(parents=True,exist_ok=True)
          (root/"summary.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Commit compact population evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc1-real-planning-popselected/summary.json
          git commit -m "data: record frozen planning population subset"
          git push
