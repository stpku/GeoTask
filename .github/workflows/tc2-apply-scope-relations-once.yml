name: tc2-apply-scope-relations-once

on:
  push:
    branches:
      - feat/task-context-tc2-spatial-applicability-v0.1
    paths:
      - .github/workflows/tc2-apply-scope-relations-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replace benchmark-local containment arithmetic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/tc1_real/recorded_context.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from geotask_core.task_context import (\n    ContextCandidate,\n    ContextRequirement,\n    TaskContext,\n    TaskFrame,\n    assess_task_context,\n)\n"
          import_replacement = import_anchor + "from geotask_core.spatial_scope import rect_contains_rect\n"
          if import_anchor not in text:
              raise SystemExit("task_context import anchor not found")
          if "from geotask_core.spatial_scope import rect_contains_rect" not in text:
              text = text.replace(import_anchor, import_replacement, 1)

          old = '''    if not (\n        r0_bbox[0] <= task_bbox[0]\n        and r0_bbox[1] <= task_bbox[1]\n        and r0_bbox[2] >= task_bbox[2]\n        and r0_bbox[3] >= task_bbox[3]\n    ):\n        raise ValueError("recorded UASFM R0 bbox does not contain task bbox")\n'''
          new = '''    if not rect_contains_rect(r0_bbox, task_bbox):\n        raise ValueError("recorded UASFM R0 bbox does not contain task bbox")\n'''
          if old not in text:
              raise SystemExit("local bbox containment block not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit replacement and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tc2-apply-scope-relations-once.yml
          git add benchmarks/tc1_real/recorded_context.py
          git commit -m "refactor: use Core rectangle containment in M1 replay"
          git push
