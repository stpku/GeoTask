name: temporal-evidence-refresh-once

on:
  push:
    branches:
      - feat/task-context-temporal-refinement-v0.1
    paths:
      - .github/workflows/temporal-evidence-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Clarify source-document semantics and refresh score
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from benchmarks.temporal_refinement.real_runner import (
              run_temporal_real_stress,
              summary_to_jsonable,
          )

          root = Path(
              "benchmarks/temporal_refinement/fixtures/"
              "nws_south_mountain_20260818"
          )
          fixture_path = root / "hourly-reference.json"
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          fixture.pop("raw_source_records_committed", None)
          fixture["normalized_source_documents_committed"] = True
          fixture["original_http_response_bytes_committed"] = False
          fixture["original_http_response_hashes_recorded"] = True
          fixture_path.write_text(
              json.dumps(fixture, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = run_temporal_real_stress(fixture_path)
          (root / "real-result.json").write_text(
              json.dumps(summary_to_jsonable(summary), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "total_cases": summary.total_cases,
                      "coarse_stop_case_count": summary.coarse_stop_case_count,
                      "refinement_case_count": summary.refinement_case_count,
                      "unsafe_stop_count": summary.unsafe_stop_count,
                      "unnecessary_refinement_count": summary.unnecessary_refinement_count,
                      "payload_overhead_case_count": summary.payload_overhead_case_count,
                      "worst_case_payload_ratio": summary.worst_case_payload_ratio,
                      "context_payload_reduction_ratio": summary.context_payload_reduction_ratio,
                      "cross_domain_stress_gate_pass": summary.cross_domain_stress_gate_pass,
                  },
                  sort_keys=True,
              )
          )
          PY
      - name: Commit refreshed evidence and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporal-evidence-refresh-once.yml
          git add benchmarks/temporal_refinement/fixtures/nws_south_mountain_20260818/hourly-reference.json
          git add benchmarks/temporal_refinement/fixtures/nws_south_mountain_20260818/real-result.json
          git commit -m "data: clarify temporal evidence and countermetrics"
          git push
