name: temporal-nws-acquisition-once

on:
  push:
    branches:
      - feat/task-context-temporal-refinement-v0.1
    paths:
      - .github/workflows/temporal-nws-acquisition-once.yml

permissions:
  contents: write

jobs:
  acquire-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Acquire and validate NWS hourly reference
        run: |
          python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          from benchmarks.temporal_refinement.nws_acquisition import (
              POINTS_ENDPOINT,
              build_hourly_forecast_url,
              extract_forecast_hourly_endpoint,
              extract_pinned_periods,
              request_headers,
          )
          from benchmarks.temporal_refinement.real_runner import (
              run_temporal_real_stress,
              summary_to_jsonable,
          )

          root = Path(
              "benchmarks/temporal_refinement/fixtures/"
              "nws_south_mountain_20260818"
          )
          root.mkdir(parents=True, exist_ok=True)

          headers = request_headers()

          def get_json(url: str) -> tuple[dict[str, object], bytes, str | None]:
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  payload = response.read()
                  content_type = response.headers.get("Content-Type")
              document = json.loads(payload.decode("utf-8"))
              if not isinstance(document, dict):
                  raise ValueError(f"{url} did not return a JSON mapping")
              return document, payload, content_type

          points, points_bytes, points_type = get_json(POINTS_ENDPOINT)
          hourly_endpoint = extract_forecast_hourly_endpoint(points)
          hourly_url = build_hourly_forecast_url(hourly_endpoint)
          hourly, hourly_bytes, hourly_type = get_json(hourly_url)
          periods = extract_pinned_periods(hourly)

          (root / "points-response.json").write_text(
              json.dumps(points, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "hourly-response.json").write_text(
              json.dumps(hourly, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          fixture = {
              "stage": "HOURLY_REFERENCE_ACQUIRED",
              "acquired_at": datetime.now(timezone.utc).isoformat(),
              "points_request_url": POINTS_ENDPOINT,
              "forecast_hourly_endpoint": hourly_endpoint,
              "forecast_hourly_request_url": hourly_url,
              "points_content_type": points_type,
              "hourly_content_type": hourly_type,
              "points_response_bytes": len(points_bytes),
              "hourly_response_bytes": len(hourly_bytes),
              "points_response_sha256": hashlib.sha256(points_bytes).hexdigest(),
              "hourly_response_sha256": hashlib.sha256(hourly_bytes).hexdigest(),
              "raw_source_records_committed": True,
              "period_count": len(periods),
              "periods": [
                  {
                      "start_time": item.start_time,
                      "end_time": item.end_time,
                      "wind_kmh": item.wind_kmh,
                      "precip_probability_percent": item.precip_probability_percent,
                  }
                  for item in periods
              ],
          }
          fixture_path = root / "hourly-reference.json"
          fixture_path.write_text(
              json.dumps(fixture, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = run_temporal_real_stress(fixture_path)
          (root / "real-result.json").write_text(
              json.dumps(summary_to_jsonable(summary), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "total_cases": summary.total_cases,
                      "coarse_stop_case_count": summary.coarse_stop_case_count,
                      "refinement_case_count": summary.refinement_case_count,
                      "unsafe_stop_count": summary.unsafe_stop_count,
                      "unnecessary_refinement_count": summary.unnecessary_refinement_count,
                      "final_resolution_counts": summary.final_resolution_counts,
                      "adaptive_context_payload_bytes": summary.adaptive_context_payload_bytes,
                      "always_hourly_context_payload_bytes": summary.always_hourly_context_payload_bytes,
                      "context_payload_reduction_ratio": summary.context_payload_reduction_ratio,
                      "mandatory_stop_control_present": summary.mandatory_stop_control_present,
                      "mandatory_refine_control_present": summary.mandatory_refine_control_present,
                      "cross_domain_stress_gate_pass": summary.cross_domain_stress_gate_pass,
                  },
                  sort_keys=True,
              )
          )
          PY
      - name: Commit evidence and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporal-nws-acquisition-once.yml
          git add benchmarks/temporal_refinement/fixtures/nws_south_mountain_20260818
          git commit -m "data: pin NWS temporal refinement evidence"
          git push
