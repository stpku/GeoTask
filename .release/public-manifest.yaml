# GeoTask Core — Public Export Manifest
manifest_version: "1.0"
project: "geotask-core"

include:
  # CI and git
  - ".github/workflows/ci.yml"
  - ".github/workflows/pages.yml"
  - ".github/workflows/publish-pypi.yml"
  - ".github/CODEOWNERS"
  - ".github/ISSUE_TEMPLATE/**"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - ".github/dependabot.yml"
  - ".gitignore"
  - ".gitattributes"

  # Public Core source
  - "src/geotask_core/**"

  # Public tests — explicit whitelist (NOT tests/**)
  - "tests/test_architecture_boundaries.py"
  - "tests/test_cli_foundation_commands.py"
  - "tests/test_cli_inspect.py"
  - "tests/test_core_examples_v0_2.py"
  - "tests/test_mobile_experience_page.py"
  - "tests/test_project_portal.py"
  - "tests/test_gt02_experience_page.py"
  - "tests/test_gt03_experience_page.py"
  - "tests/test_gt04_experience_page.py"
  - "tests/test_gt05_experience_page.py"
  - "tests/test_gt06_experience_page.py"
  - "tests/test_gt06_multi_constraint_case.py"
  - "tests/test_gt07_experience_page.py"
  - "tests/test_gt07_unverifiable_case.py"
  - "tests/test_gt08_experience_page.py"
  - "tests/test_gt08_evidence_request_case.py"
  - "tests/test_gt09_experience_page.py"
  - "tests/test_gt09_evidence_conflict_case.py"
  - "tests/test_gt10_experience_page.py"
  - "tests/test_gt10_robot_corridor_case.py"
  - "tests/test_gt11_experience_page.py"
  - "tests/test_gt11_robot_accessible_route_case.py"
  - "tests/test_gt12_experience_page.py"
  - "tests/test_gt12_uav_energy_reserve_case.py"
  - "tests/test_gt13_experience_page.py"
  - "tests/test_gt13_vehicle_clearance_case.py"
  - "tests/test_gt14_experience_page.py"
  - "tests/test_gt14_emergency_response_case.py"
  - "tests/test_gt15_experience_page.py"
  - "tests/test_gt15_robot_live_obstacle_case.py"
  - "tests/test_gt16_experience_page.py"
  - "tests/test_gt16_uav_route_crossing_case.py"
  - "tests/test_gt17_experience_page.py"
  - "tests/test_gt17_city_event_deduplication_case.py"
  - "tests/test_gt18_experience_page.py"
  - "tests/test_gt18_rescue_robot_route_hazard_case.py"
  - "tests/test_documentation_system.py"
  - "tests/test_operator_registry.py"
  - "tests/test_ops.py"
  - "tests/test_ops_v0_3.py"
  - "tests/test_parser.py"
  - "tests/test_parser_diagnostics.py"
  - "tests/test_runner.py"
  - "tests/test_evaluator.py"
  - "tests/test_normalizer.py"
  - "tests/test_normalizer_v0_2.py"
  - "tests/test_verifier.py"
  - "tests/test_version_consistency.py"
  - "tests/test_release_pipeline_regression.py"
  - "tests/v1/**"

  # CI and release tooling (public)
  - ".github/workflows/ci.yml"
  - ".release/public-manifest.yaml"
  - ".release/export_public.py"
  - ".release/release_public.py"
  - ".release/verify_public_export.py"
  - ".release/scan_public_export.py"
  - ".release/hash_public_export.py"
  - ".release/README.md"

  # Public examples
  - "examples/core/**"
  - "examples/geotask_core_lite.yaml"
  - "examples/basic_distance.yaml"
  - "examples/route_zone_intersection.yaml"
  - "examples/deepseek_output_sample.txt"
  - "examples/eval_expected_result.yaml"
  - "examples/model_outputs/**"
  - "examples/README.md"

  # Public mobile experience page
  - "site/**"

  # Public docs
  - "docs/README.md"
  - "docs/README.en.md"
  - "docs/whitepaper/GeoTask_White_Paper_v0.1.md"
  - "docs/whitepaper/README.md"
  - "docs/spec/geotask-language-spec-v1.0.md"
  - "docs/spec/target-specification-status.md"
  - "docs/tutorials/quickstart.md"
  - "docs/tutorials/quickstart.zh-CN.md"
  - "docs/reference/status-model.md"
  - "docs/reference/evidence-and-recovery.md"
  - "docs/cookbook/gt01-gt18.md"
  - "docs/cookbook/gt01-gt18.zh-CN.md"
  - "docs/release_v0_1_0.md"
  - "docs/release_v0_1_1.md"
  - "docs/architecture.md"
  - "docs/operator-guide.md"
  - "docs/cli_usage.md"
  - "docs/design_principles.md"
  - "docs/format_spec.md"
  - "docs/geotask_yaml_schema.md"
  - "docs/open_source_boundary.md"
  - "docs/open_core_commercial_runtime_boundary.md"
  - "docs/operator_registry.md"
  - "docs/product_architecture_v0_1.md"
  - "docs/normalizer_v0_2_design.md"
  - "docs/eval_spec.md"
  - "docs/architecture_decisions/**"

  # Public machine-readable specification
  - "schemas/geotask-v1.0.schema.json"

  # Root docs
  - "README.md"
  - "README.en.md"
  - "ROADMAP.md"
  - "CITATION.cff"
  - "LICENSE"
  - "CHANGELOG.md"
  - "MIGRATION.md"
  - "pyproject.toml"
  - "MANIFEST.in"
  - "requirements.txt"
  - "CONTRIBUTING.md"
  - "CONTRIBUTING.zh-CN.md"
  - "CODE_OF_CONDUCT.md"
  - "SECURITY.md"

exclude:
  - "**/__pycache__/**"
  - "**/__pycache__"
  - "**/*.pyc"
  - "**/*.pyo"
  - "**/.pytest_cache/**"
  - "**/.coverage"
  - "**/.coverage.*"
  - "**/.DS_Store"
  - "tests/test_public_export.py"
  - "patent_evidence/**"
  - ".omx/**"
  - ".ai-bridge/**"
  - "benchmarks/**"
  - "docs/reports/**"
  - "docs/superpowers/**"
  - "docs/GeoTask Specification v1.0.md"
  - "docs/patent_evidence_guide.md"
  - "docs/patent_normalizer_disclosure.md"
  - "docs/encoding_benchmark_v0_1.md"
  - "docs/encoding_benchmark_v0_2.md"
  - "docs/core_normalizer_verifier_v0_3.md"
  - "docs/lowalt_site_precheck_pack_v0_1.md"
  - "docs/repository_migration.md"
  - "docs/productization_roadmap_v0_1.md"
  - "docs/domain_pack_architecture.md"
  - "docs/patent_boundary.md"
  - "scripts/**"
  - "examples/domain_packs/**"
  - "examples/runtime/**"
  - "examples/stir_core_lite.yaml"

required:
  - "README.md"
  - "README.en.md"
  - "ROADMAP.md"
  - "CITATION.cff"
  - "docs/README.md"
  - "docs/README.en.md"
  - "docs/tutorials/quickstart.zh-CN.md"
  - "docs/cookbook/gt01-gt18.zh-CN.md"
  - "CONTRIBUTING.zh-CN.md"
  - "CODE_OF_CONDUCT.md"
  - ".github/CODEOWNERS"
  - ".github/ISSUE_TEMPLATE/bug_report.yml"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - ".github/workflows/publish-pypi.yml"
  - "LICENSE"
  - "pyproject.toml"
  - "MANIFEST.in"
  - "src/geotask_core/__init__.py"
  - ".github/workflows/ci.yml"
  - ".release/export_public.py"
  - ".release/release_public.py"
  - ".gitignore"
  - "docs/whitepaper/GeoTask_White_Paper_v0.1.md"
  - "docs/whitepaper/README.md"
  - "docs/release_v0_1_0.md"
  - "docs/release_v0_1_1.md"
  - "docs/spec/geotask-language-spec-v1.0.md"
  - "schemas/geotask-v1.0.schema.json"
  - "site/index.html"
  - "site/gt01/index.html"
  - "site/gt14/index.html"
  - "site/gt15/index.html"
  - "site/gt16/index.html"
  - "site/gt17/index.html"
  - "site/gt18/index.html"
  - "site/robots.txt"
  - "site/sitemap.xml"
  - ".github/workflows/pages.yml"
  - "tests/test_project_portal.py"
  - "tests/test_version_consistency.py"
  - "tests/test_release_pipeline_regression.py"

forbidden_paths:
  - "src/geotask_runtime/"
  - "src/geotask_domain_packs/"
  - "patent_evidence/"
  - "benchmarks/"
  - ".omx/"
  - ".ai-bridge/"
  - "scripts/"
  - "docs/reports/"
  - "docs/superpowers/"
  - "examples/domain_packs/"
  - "examples/runtime/"

forbidden_content_patterns:
  - pattern: "geotask_internal"
    description: "Internal import"
    severity: "error"
  - pattern: "private_runtime"
    description: "Private runtime reference"
    severity: "error"
  - pattern: 'from geotask_domain_packs'
    description: "Domain pack import in Core"
    severity: "error"
  - pattern: 'from geotask_runtime\.(planner|router|mock_runtime|domain_pack|result_governance)'
    description: "Private runtime module import in Core"
    severity: "error"

boundary_rules:
  forbidden_core_imports:
    - "geotask_domain_packs"
    - "geotask_runtime.planner"
    - "geotask_runtime.router"
    - "geotask_runtime.mock_runtime"
    - "geotask_runtime.domain_pack"
    - "geotask_runtime.result_governance"
  allowed_core_imports:
    - "geotask_runtime.contracts"
    - "geotask_core"
    - "geotask_core.v1"

binary_extensions:
  - ".pyc"
  - ".pyo"
  - ".pyd"
  - ".so"
  - ".dll"
  - ".dylib"
  - ".exe"
  - ".bin"
  - ".zip"
  - ".tar"
  - ".gz"
  - ".7z"
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".gif"
  - ".ico"
  - ".pdf"
  - ".docx"

# Exception model — each scanner has its own independent exception list
exact_exceptions:
  allowed_forbidden_imports:
    - from_pattern: "geotask_runtime.contracts"
      in_file: "tests/**"
      reason: "Runtime contracts are public interface definitions"
  allowed_secret_findings: []
  allowed_internal_paths: []
  allowed_binary_files: []

output:
  format: "text"
  show_file_sizes: true
  show_total_count: true
  show_total_size: true
