catalog_version: "1.0"
base_url: https://stpku.github.io/GeoTask/
portal_lastmod: "2026-08-04"
handbook:
  path: docs/README.md
  label_zh: 查看中文文档导航 →

stages:
  - id: spatial_relations
    number: 1
    title_zh: 空间关系：对象、算子与边界语义
  - id: spatiotemporal_composition
    number: 2
    title_zh: 时空组合：二维、高度与时间
  - id: evidence_governance
    number: 3
    title_zh: 不确定性与证据：不知道以后怎么办
  - id: action_feasibility
    number: 4
    title_zh: 行动与可行性：从判断走向执行
  - id: world_state_cycle
    number: 5
    title_zh: 世界状态循环：观测记录、快照与增量复核
  - id: verification_provider_ecosystem
    number: 6
    title_zh: 验证提供方生态：外部核验与可信保证

cases:
  - id: GT01
    slug: gt01
    stage: spatial_relations
    title_zh: 模型得到5米，为什么还要本地复算？
    summary_zh: 用两个点和distance_2d建立第一条模型—确定性验证路径。
    page: site/gt01/index.html
    example: examples/geotask_core_lite.yaml
    lastmod: "2026-07-27"
  - id: GT02
    slug: gt02
    stage: spatial_relations
    title_zh: 答对，不等于已经验证
    summary_zh: 比较模型给出的144.22米与浏览器本地确定性结果。
    page: site/gt02/index.html
    example: examples/core/assertions_expected_results.yaml
    lastmod: "2026-07-27"
  - id: GT03
    slug: gt03
    stage: spatial_relations
    title_zh: 最后一段进入限制区，整条路线算相交吗？
    summary_zh: 逐段检查折线，而不是只看起点与终点。
    page: site/gt03/index.html
    example: examples/route_zone_intersection.yaml
    lastmod: "2026-07-27"
  - id: GT04
    slug: gt04
    stage: spatiotemporal_composition
    title_zh: 水平相交但高度分离，算冲突吗？
    summary_zh: 二维投影重叠不等于三维空间冲突。
    page: site/gt04/index.html
    example: examples/core/time_altitude_overlap.yaml
    lastmod: "2026-07-27"
  - id: GT05
    slug: gt05
    stage: spatiotemporal_composition
    title_zh: 位置高度相同，但时间不同，算冲突吗？
    summary_zh: 显式核验时间区间，而不是只看空间关系。
    page: site/gt05/index.html
    example: examples/core/time_altitude_overlap.yaml
    lastmod: "2026-07-27"
  - id: GT06
    slug: gt06
    stage: spatiotemporal_composition
    title_zh: 多项条件怎样组合成最终结论？
    summary_zh: 路线相交、高度重叠、时间不重叠，通过显式AND得到false。
    page: site/gt06/index.html
    example: examples/core/multi_constraint_conflict.yaml
    lastmod: "2026-07-27"
  - id: GT07
    slug: gt07
    stage: evidence_governance
    title_zh: 时间条件无法核验，AI能强行判断吗？
    summary_zh: true AND true AND unknown仍然是unknown。
    page: site/gt07/index.html
    example: examples/core/unverifiable_constraint.yaml
    lastmod: "2026-07-27"
  - id: GT08
    slug: gt08
    stage: evidence_governance
    title_zh: AI知道自己不知道以后，下一步做什么？
    summary_zh: 生成结构化补证据任务，并在证据补齐后重新执行受影响断言。
    page: site/gt08/index.html
    example: examples/core/evidence_request_plan.yaml
    lastmod: "2026-07-30"
  - id: GT09
    slug: gt09
    stage: evidence_governance
    title_zh: 两份禁飞通知互相矛盾，信哪一份？
    summary_zh: 单份证据已核验，不代表多份证据彼此一致。
    page: site/gt09/index.html
    example: examples/core/evidence_conflict_review.yaml
    lastmod: "2026-07-27"
  - id: GT10
    slug: gt10
    stage: action_feasibility
    title_zh: 两台机器人抢同一条窄通道，谁先走？
    summary_zh: 把容量、占用时间和优先级转化为可执行协调计划。
    page: site/gt10/index.html
    example: examples/core/robot_corridor_coordination.yaml
    lastmod: "2026-07-27"
  - id: GT11
    slug: gt11
    stage: action_feasibility
    title_zh: 目标只有50米，机器人为什么绕行300米？
    summary_zh: 几何距离不等于对象在真实网络中的可达路线。
    page: site/gt11/index.html
    example: examples/core/robot_accessible_route.yaml
    lastmod: "2026-07-27"
  - id: GT12
    slug: gt12
    stage: action_feasibility
    title_zh: 电量够到达，无人机为什么仍不能起飞？
    summary_zh: 能到达目标不等于能保留安全余量完成任务。
    page: site/gt12/index.html
    example: examples/core/uav_energy_reserve.yaml
    lastmod: "2026-07-27"
  - id: GT13
    slug: gt13
    stage: action_feasibility
    title_zh: 道路开放，车辆为什么还是过不去？
    summary_zh: 道路状态与具体车辆的安全空间包络必须分别判断。
    page: site/gt13/index.html
    example: examples/core/vehicle_clearance_envelope.yaml
    lastmod: "2026-07-27"
  - id: GT14
    slug: gt14
    stage: action_feasibility
    title_zh: 最近的救援队，为什么不一定最快到达？
    summary_zh: 直线距离只是空间事实，派遣动作必须验证真实路线、准备时间和响应窗口。
    page: site/gt14/index.html
    example: examples/core/emergency_response_fastest_arrival.yaml
    lastmod: "2026-07-28"
  - id: GT15
    slug: gt15
    stage: action_feasibility
    title_zh: 地图说可以通行，机器人为什么停下来了？
    summary_zh: 静态地图描述结构可通行性，实时感知决定当前路线是否被障碍占据。
    page: site/gt15/index.html
    example: examples/core/robot_live_obstacle_stop.yaml
    lastmod: "2026-07-28"
  - id: GT16
    slug: gt16
    stage: action_feasibility
    title_zh: 计划已经安全，为什么无人机仍要持续监测？
    summary_zh: 初始间隔满足要求，但A机延误40秒后预测间隔从120秒缩至80秒；结论仍可用，却必须持续监测并准备增量复核。
    page: site/gt16/index.html
    example: examples/core/uav_route_crossing_temporal_separation.yaml
    lastmod: "2026-08-01"
  - id: GT17
    slug: gt17
    stage: action_feasibility
    title_zh: 同一个事件被上报十次，系统应该生成十个任务吗？
    summary_zh: 空间、时间和事件语义一致时，应合并处置任务并保留全部来源证据。
    page: site/gt17/index.html
    example: examples/core/city_event_report_deduplication.yaml
    lastmod: "2026-07-28"
  - id: GT18
    slug: gt18
    stage: action_feasibility
    title_zh: 最短路线已经找到，为什么救援机器人仍然不能进入？
    summary_zh: 路线能够到达目标仍不足以执行，还必须核验危险区和具体设备耐受能力。
    page: site/gt18/index.html
    example: examples/core/rescue_robot_shortest_route_hazard.yaml
    lastmod: "2026-07-28"
  - id: GT19
    slug: gt19
    stage: action_feasibility
    title_zh: 无人机已经到达目标上空，为什么仍然不能投放物资？
    summary_zh: 导航到达、高度和时间合规仍不足以释放载荷，还必须取得新鲜的地面净空证据。
    page: site/gt19/index.html
    example: examples/core/uav_arrival_ground_clearance_release.yaml
    lastmod: "2026-07-28"
  - id: GT20
    slug: gt20
    stage: action_feasibility
    title_zh: 车辆已经获得绿灯，为什么仍然不能进入路口？
    summary_zh: 信号许可仍不足以进入冲突区，还必须证明下游出口净空并能容纳完整车辆。
    page: site/gt20/index.html
    example: examples/core/vehicle_green_light_downstream_blockage.yaml
    lastmod: "2026-07-28"
  - id: GT21
    slug: gt21
    stage: world_state_cycle
    title_zh: 遥测显示延误60秒，运行审核记录显示55秒，AI应该相信哪一个？
    summary_zh: 同一架无人机的延误数据来自两个系统。直接覆盖、取平均或按到达顺序选择都会掩盖冲突，必须使用业务方明确声明的处理规则。
    page: site/gt21/index.html
    example: examples/core/gt21_observation_conflict_precedence.json
    lastmod: "2026-08-04"
  - id: GT22
    slug: gt22
    stage: world_state_cycle
    title_zh: 无人机的位置和电量来自两个系统，AI怎样形成同一时刻的可靠运行快照？
    summary_zh: 位置与电量分别到达时，不能简单拼接成“当前状态”。系统必须确认对象、时间和字段归属，才能形成可追溯的统一运行快照。
    page: site/gt22/index.html
    example: examples/core/gt22_initial_world_state_snapshot.json
    lastmod: "2026-08-04"
  - id: GT23
    slug: gt23
    stage: world_state_cycle
    title_zh: 无人机飞行五分钟后位置和电量都变了，系统如何证明“现在”不是“刚才”？
    summary_zh: 只覆盖最新值会丢失历史和变化依据。系统必须保留前后运行快照，绑定300秒时间差，并明确记录位置、电量和对象有效期变化。
    page: site/gt23/index.html
    example: examples/core/gt23_uav_state_change.json
    lastmod: "2026-08-04"
  - id: GT24
    slug: gt24
    stage: world_state_cycle
    title_zh: 临时禁飞区发布后，哪些航线、任务和审批结论必须重新检查？
    summary_zh: 医疗航线穿越临时禁飞区，巡检航线绕开。系统只将医疗航线、任务、审批和起飞动作纳入复核链，避免全量重算或只更新地图。
    page: site/gt24/index.html
    example: examples/core/gt24_temporary_no_fly_zone_impact.json
    lastmod: "2026-08-04"
  - id: GT25
    slug: gt25
    stage: world_state_cycle
    title_zh: 无人机位置更新后，哪些安全距离需要重算，哪些结果可以继续沿用？
    summary_zh: 无人机从走廊100米移动到130米后，只重算与无人机位置相关的两项安全距离，同时保留固定设施间距和电池余量。
    page: site/gt25/index.html
    example: examples/core/gt25_corridor_safety_recompute.json
    lastmod: "2026-08-04"
  - id: GT26
    slug: gt26
    stage: world_state_cycle
    title_zh: 飞行服务站营业时间已经失效，系统应该改哪条数据，而不是推翻全部结果？
    summary_zh: 服务站营业计划从08:00—22:00调整为09:00—18:00，系统只允许替换营业计划，保留位置、频率、服务类型和联系方式，并阻断20:30任务直至复核。
    page: site/gt26/index.html
    example: examples/core/gt26_flight_service_station_schedule_correction.json
    lastmod: "2026-08-04"
  - id: GT27
    slug: gt27
    stage: world_state_cycle
    title_zh: 一条气象数据更新后，如何只复核受影响的飞行任务？
    summary_zh: 东区风速由6升至12米/秒后，只复核同区域且处于更新生效时段的配送和应急任务；一个结果变为不适飞，另一个复核后仍适飞，西区和更新前任务继续复用。
    page: site/gt27/index.html
    example: examples/core/gt27_weather_incremental_reevaluation.json
    lastmod: "2026-08-04"
  - id: GT28
    slug: gt28
    stage: world_state_cycle
    title_zh: 路线安全、天气合格，就可以自动起飞吗？
    summary_zh: 路线、高度、天气窗口和风速预检全部通过，但空域、运营人、起降场、气象放行和任务授权仍缺失；预检结论可引用，自动起飞授权与起飞指令保持阻断。
    page: site/gt28/index.html
    example: examples/core/gt28_takeoff_authorization_gate.json
    lastmod: "2026-08-04"
  - id: GT29
    slug: gt29
    stage: verification_provider_ecosystem
    title_zh: 气象服务数据和现场传感器冲突时，AI应该相信谁？
    summary_zh: 模拟气象服务给出8米/秒，现场传感器给出13米/秒。两个来源都新鲜且相互独立，但数值仍然冲突，因此天气结论保持未知，并请求第三个独立来源。
    page: site/gt29/index.html
    example: examples/core/gt29_weather_provider_conflict.json
    lastmod: "2026-08-04"
  - id: GT30
    slug: gt30
    stage: verification_provider_ecosystem
    title_zh: 第三个独立气象来源加入后，冲突就自动解决了吗？
    summary_zh: 第三个独立来源也给出13米/秒，形成二比一；但可信保证档案没有声明多数表决规则，因此系统仍保持未知，不静默删除8米/秒来源，并请求显式气象裁决。
    page: site/gt30/index.html
    example: examples/core/gt30_three_source_weather_conflict.json
    lastmod: "2026-08-04"
