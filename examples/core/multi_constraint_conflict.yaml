geotask:
  id: "gt06-multi-constraint-conflict"
  name: "GT06 Multi-Constraint Conflict"
  schema_version: "1.0"
  goal: "Execute three deterministic checks and combine them with an explicit AND rule."

space:
  crs:
    type: "local_cartesian"
    identifier: "local_xy_m"
  horizontal_unit: "meter"
  vertical_unit: "meter"

objects:
  route:
    type: "polyline"
    coordinates:
      - [-200, 0]
      - [400, 0]
  restricted_zone:
    type: "rect"
    bbox: [250, -100, 350, 100]
  flight_altitude:
    type: "altitude_interval"
    min: 100
    max: 150
    unit: "meter"
  restricted_altitude:
    type: "altitude_interval"
    min: 120
    max: 180
    unit: "meter"
  flight_time:
    type: "time_interval"
    start: "08:00"
    end: "09:00"
  restricted_time:
    type: "time_interval"
    start: "15:00"
    end: "17:00"

operator_set:
  - line_intersects_rect
  - altitude_overlap
  - time_overlap

tasks:
  - id: "evaluate_constraints"
    family: "spatiotemporal_topology"
    goal: "Evaluate horizontal, vertical, and temporal conflict conditions independently."
    assertions:
      - id: "route_intersects_zone"
        operator: "line_intersects_rect"
        object_refs: ["route", "restricted_zone"]
        expected_type: "bool"
      - id: "altitude_conflict"
        operator: "altitude_overlap"
        object_refs: ["flight_altitude", "restricted_altitude"]
        expected_type: "bool"
      - id: "temporal_conflict"
        operator: "time_overlap"
        object_refs: ["flight_time", "restricted_time"]
        expected_type: "bool"

execution:
  mode: "local_only"
  steps:
    - id: "run_local_checks"
      executor: "local"
      assertion_refs:
        - "route_intersects_zone"
        - "altitude_conflict"
        - "temporal_conflict"

output_contract:
  format: "structured"
  required_fields: []

extensions:
  decision_rule:
    id: "full_conflict"
    expression: "route_intersects_zone AND altitude_conflict AND temporal_conflict"
    expected: false
