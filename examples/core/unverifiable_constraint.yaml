geotask:
  id: "gt07-unverifiable-constraint"
  name: "GT07 Unverifiable Constraint"
  schema_version: "1.0"
  goal: "Preserve an unknown required condition instead of forcing a boolean conclusion."

space:
  crs:
    type: "local_cartesian"
    identifier: "local_xy_m"
  horizontal_unit: "meter"
  vertical_unit: "meter"

objects:
  route:
    type: "polyline"
    coordinates:
      - [-200, 0]
      - [400, 0]
  restricted_zone:
    type: "rect"
    bbox: [250, -100, 350, 100]
  flight_altitude:
    type: "altitude_interval"
    min: 100
    max: 150
    unit: "meter"
  restricted_altitude:
    type: "altitude_interval"
    min: 120
    max: 180
    unit: "meter"
  flight_time:
    type: "time_interval"
    start: "08:00"
    end: "09:00"
  provisional_restricted_time:
    type: "time_interval"
    start: "08:30"
    end: "10:00"

operator_set:
  - line_intersects_rect
  - altitude_overlap
  - time_overlap

tasks:
  - id: "evaluate_required_conditions"
    family: "spatiotemporal_topology"
    goal: "Evaluate two verified conditions and preserve an unverifiable schedule condition."
    assertions:
      - id: "route_intersects_zone"
        operator: "line_intersects_rect"
        object_refs: ["route", "restricted_zone"]
        expected_type: "bool"
      - id: "altitude_conflict"
        operator: "altitude_overlap"
        object_refs: ["flight_altitude", "restricted_altitude"]
        expected_type: "bool"
      - id: "temporal_conflict"
        operator: "time_overlap"
        object_refs: ["flight_time", "provisional_restricted_time"]
        expected_type: "bool"
        condition: "restricted_schedule_verified"

execution:
  mode: "local_only"
  steps:
    - id: "run_local_checks"
      executor: "local"
      assertion_refs:
        - "route_intersects_zone"
        - "altitude_conflict"
        - "temporal_conflict"

output_contract:
  format: "structured"
  required_fields: []

extensions:
  extension_profile:
    id: "geotask.control"
    version: "1.0"
  decision_rule:
    id: "full_conflict"
    logic: "three_valued_and"
    expression: "route_intersects_zone AND altitude_conflict AND temporal_conflict"
    unknown_policy: "propagate"
    expected_status: "unverifiable"
  evidence_note: "The restricted schedule interval is provisional and has not been verified."
