geotask:
  id: "point-to-line-distance-minimal-zh-cn"
  name: "点到折线距离最小示例"
  description: "测量一个偏离路线的点，以及一个恰好位于路线边界上的点。"
  schema_version: "1.0"
  language: "zh-CN"
  domain: "general_spatial"

space:
  crs:
    type: "local_cartesian"
    identifier: "local_xy_m"
  axes:
    x: "east"
    y: "north"
  horizontal_unit: "meter"
  coordinate_order: ["x", "y"]

objects:
  off_route_point:
    type: "point"
    coordinates: [3, 4]
  on_route_point:
    type: "point"
    coordinates: [5, 0]
  route:
    type: "polyline"
    coordinates:
      - [0, 0]
      - [10, 0]

operator_set:
  - point_to_line_distance_2d

tasks:
  - id: "measure_route_distance"
    family: "measurement"
    goal: "测量两个点到路线的最短距离。"
    assertions:
      - id: "off_route_distance"
        operator: "point_to_line_distance_2d"
        object_refs: ["off_route_point", "route"]
        expected_type: "number"
        unit: "meter"
      - id: "on_route_distance"
        operator: "point_to_line_distance_2d"
        object_refs: ["on_route_point", "route"]
        expected_type: "number"
        unit: "meter"

execution:
  mode: "local_only"
  steps:
    - id: "measure"
      executor: "local"
      assertion_refs: ["off_route_distance", "on_route_distance"]
      depends_on: []

output_contract:
  format: "structured"
  required_fields:
    - "off_route_distance"
    - "on_route_distance"
  allow_additional_fields: true

expected_results:
  - name: "off_route_distance"
    value: 4.0
    unit: "meter"
  - name: "on_route_distance"
    value: 0.0
    unit: "meter"
