geotask:
  id: "provenance-evidence-audit-v1"
  name: "Provenance Evidence Audit v1.0"
  description: "Bind fictional source records to one deterministic assertion."
  schema_version: "1.0"
  language: "en"
  domain: "general_spatial"

space:
  crs:
    type: "local_cartesian"
    identifier: "fictional_survey_grid_m"
  horizontal_unit: "meter"
  vertical_unit: "meter"
  coordinate_order: ["x", "y"]
  boundary_semantics: "closed"

objects:
  survey_point_a:
    type: "point"
    coordinates: [0, 0]
  survey_point_b:
    type: "point"
    coordinates: [3, 4]

operator_set:
  - distance_2d

tasks:
  - id: "survey_distance_task"
    family: "measurement"
    goal: "Compute a fictional survey distance with explicit evidence bindings."
    assertions:
      - id: "survey_distance"
        operator: "distance_2d"
        object_refs: ["survey_point_a", "survey_point_b"]
        expected_type: "number"
        unit: "meter"

execution:
  mode: "local_only"
  steps:
    - id: "compute_distance"
      executor: "local"
      assertion_refs: ["survey_distance"]
      depends_on: []

output_contract:
  format: "structured"
  required_fields: ["survey_distance"]
  allow_additional_fields: true

provenance:
  sources:
    - id: "survey_dataset"
      kind: "dataset"
      title: "Fictional Local Survey Coordinates"
      uri: "urn:geotask:fictional:survey-dataset:2026-07-31"
      version: "1.0"
      sha256: "1111111111111111111111111111111111111111111111111111111111111111"
      issued_at: "2026-07-31T08:00:00+00:00"
      retrieved_at: "2026-07-31T08:05:00+00:00"
      verified_at: "2026-07-31T08:10:00+00:00"
    - id: "task_authoring_record"
      kind: "artifact"
      title: "Fictional Task Authoring Record"
      artifact_id: "geotask.document"
      version: "1.0"
      sha256: "2222222222222222222222222222222222222222222222222222222222222222"
      verified_at: "2026-07-31T08:12:00+00:00"
  evidence_bindings:
    - assertion_id: "survey_distance"
      source_refs: ["survey_dataset"]
  audit:
    generated_by: "fictional-geotask-authoring-tool"
    generator_version: "0.1.0"
    generated_at: "2026-07-31T08:15:00+00:00"
    audit_ref: "audit:fictional:provenance-evidence-audit-v1"
    source_refs: ["survey_dataset", "task_authoring_record"]

expected_results:
  - name: "survey_distance"
    value: 5.0
    unit: "meter"
