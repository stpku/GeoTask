geotask:
  version: "0.1-runtime"
  name: "basic_distance_runtime"
  goal: "Calculate 2D distance between two points"

space:
  crs: "local_xy_m"
  unit: "meter"
  axes:
    x: "east"
    y: "north"

objects:
  takeoff:
    type: "point"
    xy: [0, 0]
  school:
    type: "point"
    xy: [120, 80]

ops:
  distance_2d: "sqrt((x1 - x2)^2 + (y1 - y2)^2)"

task:
  questions:
    - "Calculate the 2D distance from takeoff to school."

# Runtime-specific config
runtime:
  token_budget: 100
  encoding_hint: "auto"
