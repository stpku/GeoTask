geotask:
  version: "0.1-runtime"
  name: "route_zone_runtime"
  goal: "Check route-zone intersection and distance"

space:
  crs: "local_xy_m"
  unit: "meter"

objects:
  takeoff:
    type: "point"
    xy: [0, 0]
  school:
    type: "point"
    xy: [120, 80]
  route:
    type: "line"
    points:
      - [-200, 0]
      - [400, 0]
  zone:
    type: "rect"
    bbox: [250, -100, 350, 100]

ops:
  distance_2d: "sqrt((x1 - x2)^2 + (y1 - y2)^2)"
  line_intersects_rect: "true if line segment crosses rectangle"

task:
  questions:
    - "Calculate the 2D distance from takeoff to school."
    - "Determine whether route intersects zone."

runtime:
  token_budget: 200
  encoding_hint: "auto"
