[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotask-core"
dynamic = ["version"]
description = "GeoTask Core: public contracts and deterministic kernel for explicit, verifiable spatiotemporal world models"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "GeoTask Contributors" },
]
keywords = [
    "ai-agents",
    "world-model",
    "embodied-ai",
    "spatiotemporal",
    "spatial-reasoning",
    "deterministic-verification",
    "geospatial",
    "robotics",
    "uav",
    "geotask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://stpku.github.io/GeoTask/"
Documentation = "https://stpku.github.io/GeoTask/"
Repository = "https://github.com/stpku/GeoTask"
Issues = "https://github.com/stpku/GeoTask/issues"
Changelog = "https://github.com/stpku/GeoTask/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/stpku/GeoTask/blob/main/ROADMAP.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.18",
    "matplotlib>=3.5",
]

[project.scripts]
geotask = "geotask_core.cli:main"
stir = "geotask_core.cli:main"

[tool.setuptools.dynamic]
version = {attr = "geotask_core._version.__version__"}

[tool.setuptools.cmdclass]
build_py = "geotask_build_support.BuildPy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geotask_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
